name: Build JARVIS APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Create JARVIS
        run: |
          python3 << 'PY'
          import os, textwrap, pathlib
          pathlib.Path("app/src/main/java/com/jarvis/voice").mkdir(parents=True, exist_ok=True)
          pathlib.Path("app/src/main/res/layout").mkdir(parents=True, exist_ok=True)
          open("settings.gradle","w").write("include ':app'")
          open("gradle.properties","w").write("org.gradle.jvmargs=-Xmx2048m\n")
          open("build.gradle","w").write("buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}} allprojects{repositories{google();mavenCentral()}}")
          open("app/build.gradle","w").write("plugins { id 'com.android.application' } android { compileSdk 34; defaultConfig { applicationId \"com.jarvis.voice\"; minSdk 24; targetSdk 34; versionCode 1; versionName \"1.0\" }; buildTypes { release { minifyEnabled false } } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }")
          open("app/src/main/AndroidManifest.xml","w").write('<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/><application android:label="JARVIS" android:theme="@android:style/Theme.Material.Light"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp" android:background="#0a0a0a"><TextView android:id="@+id/status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="JARVIS Ready Boss" android:textSize="22sp" android:textColor="#00FFAA" android:gravity="center"/><Button android:id="@+id/talkBtn" android:layout_width="match_parent" android:layout_height="65dp" android:text="TALK TO JARVIS" android:layout_marginTop="30dp" android:backgroundTint="#00FFAA"/></LinearLayout>')
          code = """
          package com.jarvis.voice;
          import android.content.Intent; import android.content.pm.PackageManager; import android.net.Uri; import android.os.Bundle; import android.provider.Settings; import android.speech.RecognizerIntent; import android.speech.tts.TextToSpeech; import android.widget.*; import androidx.annotation.Nullable; import androidx.appcompat.app.AppCompatActivity; import java.util.*;
          public class MainActivity extends AppCompatActivity implements TextToSpeech.OnInitListener {
            TextToSpeech tts; TextView status; final int REQ=100;
            protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); status=findViewById(R.id.status); tts=new TextToSpeech(this,this); findViewById(R.id.talkBtn).setOnClickListener(v->{ Intent i=new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH); i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM); startActivityForResult(i, REQ); status.setText("Listening..."); });}
            public void onInit(int i){ if(i==0) tts.setLanguage(Locale.US); }
            void speak(String s){ status.setText("JARVIS: "+s); tts.speak(s,0,null,null); }
            @Override protected void onActivityResult(int c,int r,@Nullable Intent d){ super.onActivityResult(c,r,d); if(c==REQ && r==RESULT_OK && d!=null){ String cmd=d.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS).get(0).toLowerCase(); status.setText("You: "+cmd);
              if(cmd.contains("google")||cmd.contains("search")){ String q=cmd.replace("google","").replace("search","").trim(); if(q.isEmpty()) q=cmd; speak("Searching Google for "+q); startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q="+Uri.encode(q)))); }
              else if(cmd.contains("setting")){ speak("Opening Settings"); startActivity(new Intent(Settings.ACTION_SETTINGS)); }
              else if(cmd.contains("open")){ Map<String,String> m=new HashMap<>(); m.put("youtube","com.google.android.youtube"); m.put("facebook","com.facebook.katana"); m.put("whatsapp","com.whatsapp"); m.put("instagram","com.instagram.android"); m.put("chrome","com.android.chrome"); for(String k:m.keySet()) if(cmd.contains(k)){ try{ Intent li=getPackageManager().getLaunchIntentForPackage(m.get(k)); if(li!=null){ speak("Opening "+k); startActivity(li); return; } }catch(Exception e){} } speak("Searching "+cmd); startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com/search?q="+Uri.encode(cmd)))); }
              else if(cmd.contains("hello")||cmd.contains("hi")){ speak("Hello Boss, I am JARVIS"); } else { speak("You said "+cmd); }
            }}
          }
          """
          open("app/src/main/java/com/jarvis/voice/MainActivity.java","w").write(textwrap.dedent(code))
          PY
          gradle wrapper --no-daemon
      - name: Build APK
        run:./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
