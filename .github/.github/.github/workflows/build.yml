name: Build JARVIS APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Create JARVIS Project
        run: |
          mkdir -p app/src/main/java/com/jarvis/voice
          mkdir -p app/src/main/res/layout

          echo "include ':app'" > settings.gradle
          echo "org.gradle.jvmargs=-Xmx2048m" > gradle.properties
          echo "buildscript{repositories{google();mavenCentral()} dependencies{classpath 'com.android.tools.build:gradle:8.2.2'}} allprojects{repositories{google();mavenCentral()}}" > build.gradle

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              compileSdk 34
              defaultConfig { applicationId "com.jarvis.voice"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="JARVIS" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp">
          <TextView android:id="@+id/status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Press to talk to JARVIS" android:textSize="20sp" android:gravity="center"/>
          <Button android:id="@+id/talkBtn" android:layout_width="match_parent" android:layout_height="60dp" android:text="TALK TO JARVIS" android:layout_marginTop="20dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/jarvis/voice/MainActivity.java <<'EOF'
          package com.jarvis.voice;
          import android.os.Bundle;
          import android.speech.tts.TextToSpeech;
          import android.widget.Button;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          import java.util.Locale;
          public class MainActivity extends AppCompatActivity implements TextToSpeech.OnInitListener {
              TextToSpeech tts; TextView status;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  status=findViewById(R.id.status);
                  tts=new TextToSpeech(this,this);
                  Button btn=findViewById(R.id.talkBtn);
                  btn.setOnClickListener(v->{
                      tts.speak("Hello Boss, I am JARVIS, ready to help", TextToSpeech.QUEUE_FLUSH, null, null);
                      status.setText("JARVIS: Hello Boss! I am ready.");
                  });
              }
              public void onInit(int i){ if(i==TextToSpeech.SUCCESS) tts.setLanguage(Locale.US); }
          }
          EOF

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
